<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timeslots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h3>Course selection</h3>
<div class="sel">
    <div class="ss">
        <div>Course #</div>
        <div>Course 1</div>
        <div>Course 2</div>
        <div>Course 3</div>
    </div>
    <div class="ss">
        <div>Name of your course</div>
        <div>
            <label for="name1">Name</label>
            <input type="text" id="name1">
        </div>
        <div>
            <label for="name2">Name</label>
            <input type="text" id="name2">
        </div>
        <div>
            <label for="name3">Name</label>
            <input type="text" id="name3">
        </div>
    </div>
    <div class="ss">
        <div>First time slot</div>
        <select id="s1a" class="select"></select>
        <select id="s2a" class="select"></select>
        <select id="s3a" class="select"></select>
    </div>
    <div class="ss">
        <div>Second time slot</div>
        <select id="s1b" class="select"></select>
        <select id="s2b" class="select"></select>
        <select id="s3b" class="select"></select>
    </div>
    <div class="ss">
        <div>Radio?</div>
        <input type="checkbox" id="r1" class="r">
        <input type="checkbox" id="r2" class="r">
        <input type="checkbox" id="r3" class="r">
    </div>
</div>
<button onclick="save()">Save</button>
<div id="hide" style="display: none">

    <h1>Timetable</h1>
    <div class="calendar">
        <div class="b"></div><div class="b">Monday</div><div class="b">Tuesday</div><div class="b">Wednesday</div><div class="b">Thursday</div><div class="b">Friday</div>
        <div class="b">1-2</div><div class="ts" id="11"></div><div class="ts" id="21"></div><div class="ts" id="31"></div><div class="ts" id="41"></div><div class="ts" id="51"></div>
        <div class="b">3-4</div><div class="ts" id="12"></div><div class="ts" id="22"></div><div class="ts" id="32"></div><div class="ts" id="42"></div><div class="ts" id="52"></div>
        <div class="b">5-6</div><div class="ts" id="13"></div><div class="ts" id="23"></div><div class="ts" id="33"></div><div class="ts" id="43"></div><div class="ts" id="53"></div>
        <div class="b">7-8</div><div class="ts" id="14"></div><div class="ts" id="24"></div><div class="ts" id="34"></div><div class="ts" id="44"></div><div class="ts" id="54"></div>
    </div>
    <h2>Choice</h2>
    <div class="choice">
        <div></div> <div>Course 1</div> <div>Course 2</div> <div>Course 3</div>
        <div>First</div> <input type="checkbox" id="c1a" class="c"><input type="checkbox" id="c2a" class="c"><input type="checkbox" id="c3a" class="c">
        <div>Second</div> <input type="checkbox" id="c1b" class="c"><input type="checkbox" id="c2b" class="c"><input type="checkbox" id="c3b" class="c">
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
